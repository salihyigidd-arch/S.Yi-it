<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S. Y İ Ğ İ T — Monumentum Mentis</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cinzel:wght@400;600;700&family=JetBrains+Mono:wght@300;400&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --sky-dark: #030611;
            --sky-blue: #0a1128;
            --warm-gold: #e5b869;
            --gold-glow: rgba(229, 184, 105, 0.35);
            --marble-light: #f3efe6;
            --card-bg: rgba(10, 17, 40, 0.82);
            --border-gold: rgba(229, 184, 105, 0.25);
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: radial-gradient(circle at 50% 100%, #172a56 0%, var(--sky-blue) 55%, var(--sky-dark) 100%);
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* MAISON CARRÉE TAPINAK SÜTUN SİLUETLERİ */
        .temple-columns {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
            opacity: 0.12;
            background-image: repeating-linear-gradient(
                90deg,
                transparent,
                transparent 50px,
                rgba(229, 184, 105, 0.8) 50px,
                rgba(229, 184, 105, 0.8) 75px,
                transparent 75px,
                transparent 140px
            );
            mask-image: linear-gradient(to top, rgba(0,0,0,1) 15%, rgba(0,0,0,0) 85%);
            -webkit-mask-image: linear-gradient(to top, rgba(0,0,0,1) 15%, rgba(0,0,0,0) 85%);
        }

        .ambient-light {
            position: fixed;
            bottom: -60px;
            left: 50%;
            transform: translateX(-50%);
            width: 100vw;
            height: 420px;
            background: radial-gradient(ellipse at bottom, rgba(229, 184, 105, 0.18) 0%, transparent 70%);
            pointer-events: none;
            z-index: 1;
        }

        .container {
            position: relative;
            z-index: 10;
            max-width: 1250px;
            margin: 0 auto;
            padding: 25px 20px;
        }

        /* TOP BAR */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 18px;
            background: rgba(4, 7, 17, 0.6);
            border: 1px solid var(--border-gold);
            border-radius: 8px;
            margin-bottom: 25px;
            backdrop-filter: blur(10px);
        }

        .status-tag {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            color: var(--warm-gold);
        }

        .btn-small {
            background: transparent;
            border: 1px solid var(--warm-gold);
            color: var(--warm-gold);
            padding: 5px 12px;
            border-radius: 5px;
            font-family: 'Cinzel', serif;
            font-size: 0.75rem;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-small:hover {
            background: var(--warm-gold);
            color: #000;
        }

        /* HEADER & GEYİK LOGOSU */
        header {
            text-align: center;
            padding: 15px 0 35px;
            border-bottom: 1px solid var(--border-gold);
            margin-bottom: 30px;
        }

        .deer-logo {
            width: 75px;
            height: 75px;
            margin: 0 auto 12px;
            display: block;
            filter: drop-shadow(0 0 12px var(--warm-gold));
            transition: transform 0.4s ease;
        }

        .deer-logo:hover {
            transform: scale(1.05);
        }

        .brand-title {
            font-family: 'Cinzel Decorative', serif;
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: 14px;
            color: var(--marble-light);
            text-shadow: 0 0 20px var(--gold-glow);
            text-transform: uppercase;
        }

        .brand-sub {
            font-family: 'JetBrains Mono', monospace;
            color: var(--warm-gold);
            font-size: 0.8rem;
            letter-spacing: 4px;
            margin-top: 8px;
            opacity: 0.9;
        }

        /* BEN KİMİM KARTI */
        .about-card {
            background: var(--card-bg);
            border: 1px solid var(--border-gold);
            border-radius: 12px;
            padding: 24px 28px;
            margin-bottom: 30px;
            backdrop-filter: blur(15px);
            box-shadow: 0 12px 30px rgba(0,0,0,0.4);
        }

        .about-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px dashed var(--border-gold);
            padding-bottom: 10px;
            margin-bottom: 14px;
            font-family: 'Cinzel', serif;
            color: var(--warm-gold);
            font-size: 1.15rem;
            letter-spacing: 1px;
        }

        .about-text {
            font-size: 0.98rem;
            line-height: 1.8;
            color: var(--marble-light);
            white-space: pre-line;
        }

        /* EDITÖR PANELİ */
        .editor-panel {
            display: none;
            background: rgba(229, 184, 105, 0.08);
            border: 1px solid var(--warm-gold);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 30px;
            backdrop-filter: blur(15px);
        }

        .editor-panel.active { display: block; }

        .editor-panel h3 {
            font-family: 'Cinzel', serif;
            color: var(--warm-gold);
            margin-bottom: 12px;
            font-size: 1.1rem;
        }

        .form-row {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 12px;
            margin-bottom: 12px;
        }

        .input-box, .select-box, .textarea-box {
            width: 100%;
            padding: 10px 14px;
            background: rgba(3, 6, 17, 0.85);
            border: 1px solid var(--border-gold);
            border-radius: 6px;
            color: #fff;
            font-family: inherit;
            outline: none;
            font-size: 0.9rem;
        }

        .textarea-box { min-height: 110px; resize: vertical; margin-bottom: 12px; }

        .btn-gold {
            background: linear-gradient(135deg, var(--warm-gold) 0%, #b8860b 100%);
            color: #000;
            font-family: 'Cinzel', serif;
            font-weight: 700;
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.3s;
            font-size: 0.85rem;
            letter-spacing: 1px;
        }

        .btn-gold:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 15px var(--gold-glow);
        }

        /* FİLTRELER */
        .filter-bar {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }

        .filter-btn {
            background: transparent;
            border: 1px solid var(--border-gold);
            color: var(--text-muted);
            padding: 7px 14px;
            border-radius: 5px;
            font-family: 'Cinzel', serif;
            font-size: 0.8rem;
            cursor: pointer;
            transition: 0.3s;
        }

        .filter-btn.active, .filter-btn:hover {
            background: var(--warm-gold);
            color: #000;
            font-weight: 700;
        }

        /* KARTLAR */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 22px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-gold);
            border-radius: 10px;
            padding: 22px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: 0.3s;
            backdrop-filter: blur(10px);
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 25px rgba(0,0,0,0.6), 0 0 15px var(--gold-glow);
        }

        .card-tag {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.72rem;
            color: var(--warm-gold);
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .card-title {
            font-family: 'Cinzel', serif;
            font-size: 1.2rem;
            color: var(--marble-light);
            margin-bottom: 10px;
            line-height: 1.35;
        }

        .card-body {
            font-size: 0.92rem;
            color: var(--text-muted);
            line-height: 1.65;
            margin-bottom: 18px;
            white-space: pre-line;
        }

        .card-foot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid rgba(255,255,255,0.06);
            padding-top: 10px;
            font-size: 0.78rem;
            color: var(--text-muted);
        }

        .btn-del {
            background: transparent;
            border: none;
            color: #ef4444;
            cursor: pointer;
            font-size: 0.78rem;
            display: none;
        }

        footer {
            text-align: center;
            margin-top: 60px;
            padding: 20px 0;
            border-top: 1px solid var(--border-gold);
            font-family: 'Cinzel', serif;
            color: var(--text-muted);
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

<div class="temple-columns"></div>
<div class="ambient-light"></div>

<div class="container">
    <!-- TOP BAR -->
    <div class="top-bar">
        <div class="status-tag" id="statusText">🌐 Ziyaretçi Modu</div>
        <button class="btn-small" id="authBtn" onclick="toggleAuth()">🔐 Editör Girişi</button>
    </div>

    <!-- HEADER & GEYİK LOGOSU -->
    <header>
        <!-- Vektörel Estetik Geyik Kafası Logosu -->
        <svg class="deer-logo" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
            <!-- Boynuz Sol -->
            <path d="M48 42C44 32 32 20 20 15C22 23 28 29 34 32C28 26 22 24 14 24C20 31 28 35 38 38C30 38 24 39 18 42C26 44 36 44 45 44" stroke="#e5b869" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <!-- Boynuz Sağ -->
            <path d="M52 42C56 32 68 20 80 15C78 23 72 29 66 32C72 26 78 24 86 24C80 31 72 35 62 38C70 38 76 39 82 42C74 44 64 44 55 44" stroke="#e5b869" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <!-- Kafa ve Geometrik Hatlar -->
            <polygon points="50,45 38,58 43,82 50,90 57,82 62,58" stroke="#e5b869" stroke-width="2" fill="rgba(229, 184, 105, 0.05)" stroke-linejoin="round"/>
            <!-- Kulaklar -->
            <path d="M38 58C30 55 24 56 20 60C26 62 34 60 39 60" stroke="#e5b869" stroke-width="1.5"/>
            <path d="M62 58C70 55 76 56 80 60C74 62 66 60 61 60" stroke="#e5b869" stroke-width="1.5"/>
            <!-- Gözler -->
            <circle cx="44" cy="62" r="1.5" fill="#e5b869"/>
            <circle cx="56" cy="62" r="1.5" fill="#e5b869"/>
            <!-- Alın Tacı -->
            <polygon points="50,48 46,54 54,54" fill="#e5b869"/>
        </svg>

        <div class="brand-title">Y İ Ğ İ T</div>
        <div class="brand-sub">MONUMENTUM MENTIS — ZİHİN TAPINAĞI</div>
    </header>

    <!-- BEN KİMİM -->
    <div class="about-card">
        <div class="about-head">
            <span>🏛️ BEN KİMİM? — YİĞİT'İN MANİFESTOSU</span>
            <button class="btn-small" id="editAboutBtn" style="display:none;" onclick="editAbout()">✏️ Düzenle</button>
        </div>
        <div class="about-text" id="aboutDisplay"></div>
    </div>

    <!-- EDITÖR PANLEİ -->
    <div class="editor-panel" id="editorPanel">
        <h3>✍️ Tapınağa Yeni Not Ekle</h3>
        <div class="form-row">
            <input type="text" id="newTitle" class="input-box" placeholder="Not / Makale Başlığı">
            <select id="newCat" class="select-box">
                <option value="Felsefe">Felsefe</option>
                <option value="Atatürk">Atatürk & Cumhuriyet</option>
                <option value="Fenerbahçe">Fenerbahçe</option>
                <option value="Diş Hekimliği">Diş Hekimliği</option>
                <option value="Siyaset">Siyaset & Din</option>
                <option value="Günlük">Günlük</option>
            </select>
        </div>
        <textarea id="newContent" class="textarea-box" placeholder="İçeriğinizi buraya yazın..."></textarea>
        <button class="btn-gold" onclick="addNote()">Yayınla & Kaydet</button>
    </div>

    <!-- FİLTRELER -->
    <div class="filter-bar">
        <button class="filter-btn active" onclick="filterNotes('all', this)">TÜMÜ</button>
        <button class="filter-btn" onclick="filterNotes('Felsefe', this)">FELSEFE</button>
        <button class="filter-btn" onclick="filterNotes('Atatürk', this)">ATATÜRK</button>
        <button class="filter-btn" onclick="filterNotes('Fenerbahçe', this)">FENERBAHÇE</button>
        <button class="filter-btn" onclick="filterNotes('Diş Hekimliği', this)">DİŞ HEKİMLİĞİ</button>
        <button class="filter-btn" onclick="filterNotes('Siyaset', this)">SİYASET/DİN</button>
        <button class="filter-btn" onclick="filterNotes('Günlük', this)">GÜNLÜK</button>
    </div>

    <!-- KARTLAR -->
    <div class="grid" id="notesGrid"></div>

    <footer>
        VERITAS, RATIO ET SAPIENTIA © 2026 — YİĞİT CİHANGİR ZİHİN ARŞİVİ
    </footer>
</div>

<script>
    const defaultAboutText = `Felsefe, tarih, siyaset, diş hekimliği ve Fenerbahçe tutkusunu tek bir entelektüel potada eriten bir zihin...

Ben Yiğit; antik Roma'nın stoacı disiplini, Mustafa Kemal Atatürk'ün sarsılmaz rasyonalizmi ve modern bilimin cerrahi hassasiyetiyle hayatı sorgulayan bir araştırmacıyım. Bu platform, zihnimdeki karmaşık fikirleri, derin tarihsel analizleri ve kişisel düşünce deneylerimi bir araya getirdiğim dijital tapınağımdır.`;

    const initialNotes = [
        {
            id: 1,
            title: "Mustafa Kemal Atatürk ve Dogmasız Akılcılık",
            cat: "Atatürk",
            date: "2026-03-30",
            content: "Mustafa Kemal Atatürk'ün devrimcilik anlayışı donmuş bir öğreti değil, sürekli yenilenen bir metodolojidir. 'Hayatta en hakiki mürşit ilimdir' derken, Doğu'nun mistik dogmatizmini de Batı'nın sömürgeci kalıplarını da reddetmiştir.\n\nAkıl ve bilimin ışığında inşa edilen bir devlet; bağımsızlığın, insan onurunun ve entelektüel hürriyetin tek teminatıdır."
        },
        {
            id: 2,
            title: "Fenerbahçe Sosyolojisi: Sahadaki Direnişten Mitinge",
            cat: "Fenerbahçe",
            date: "2026-03-29",
            content: "Fenerbahçe bir spor kulübünden çok daha fazlasıdır; Kuva-yı Milliye ruhunun sahalardaki temsilcisidir. 1918-1923 işgal yıllarında cepheye silah taşıyan, sahadan namağlup çıkarak İşgal Kuvvetleri Komutanı General Harrington Kupası'nı kazanan bu çınar, Türk milletinin moral abidesidir."
        },
        {
            id: 3,
            title: "Marcus Aurelius ve Zihnin Kalesi",
            cat: "Felsefe",
            date: "2026-03-28",
            content: "Stoacı imparator Marcus Aurelius'un 'Kendime Düşünceler' eseri, dış dünyanın kaosuna karşı inşa edilmiş bir iç kale rehberidir. Başımıza gelen olaylar nötrdür; onlara yüklediğimiz anlamlar acıyı ya da huzuru doğurur."
        },
        {
            id: 4,
            title: "Molar Biyomekanik ve Cerrahi Hassasiyet",
            cat: "Diş Hekimliği",
            date: "2026-03-27",
            content: "Diş hekimliği tıp ile heykel sanatının milimetrik birleşimidir. Çene ekleminin (TME) oklüzal dinamikleri, çiğneme kuvvetlerinin biyomekanik dağılımı ve mikroskopik cerrahi restorasyonlar... Bir diş hekimi hem sanatçı hem bilim insanıdır."
        }
    ];

    let isEditor = false;
    const PASS = "yigit1907";

    function loadData(key, fallback) {
        const val = localStorage.getItem(key);
        return val ? JSON.parse(val) : fallback;
    }

    function saveData(key, val) {
        localStorage.setItem(key, JSON.stringify(val));
    }

    function renderAbout() {
        const txt = loadData('yigit_about', defaultAboutText);
        document.getElementById('aboutDisplay').innerText = txt;
    }

    function editAbout() {
        const current = loadData('yigit_about', defaultAboutText);
        const updated = prompt("Biyografinizi düzenleyin:", current);
        if (updated !== null && updated.trim() !== "") {
            saveData('yigit_about', updated);
            renderAbout();
        }
    }

    function renderNotes(filterCategory = 'all') {
        const notes = loadData('yigit_notes', initialNotes);
        const grid = document.getElementById('notesGrid');
        grid.innerHTML = '';

        notes.forEach(n => {
            if (filterCategory !== 'all' && n.cat !== filterCategory) return;

            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div>
                    <div class="card-tag">// ${n.cat}</div>
                    <div class="card-title">${n.title}</div>
                    <div class="card-body">${n.content}</div>
                </div>
                <div class="card-foot">
                    <span>📜 ${n.date}</span>
                    <button class="btn-del" style="display:${isEditor ? 'inline' : 'none'}" onclick="deleteNote(${n.id})">Sil 🗑️</button>
                </div>
            `;
            grid.appendChild(card);
        });
    }

    function addNote() {
        const title = document.getElementById('newTitle').value.trim();
        const cat = document.getElementById('newCat').value;
        const content = document.getElementById('newContent').value.trim();

        if (!title || !content) {
            alert('Lütfen başlık ve içeriği eksiksiz yazın.');
            return;
        }

        const notes = loadData('yigit_notes', initialNotes);
        const newObj = {
            id: Date.now(),
            title: title,
            cat: cat,
            date: new Date().toISOString().split('T')[0],
            content: content
        };

        notes.unshift(newObj);
        saveData('yigit_notes', notes);

        document.getElementById('newTitle').value = '';
        document.getElementById('newContent').value = '';
        renderNotes();
        alert('Notunuz başarıyla kaydedildi!');
    }

    function deleteNote(id) {
        if (confirm('Bu notu silmek istediğinden emin misin?')) {
            let notes = loadData('yigit_notes', initialNotes);
            notes = notes.filter(n => n.id !== id);
            saveData('yigit_notes', notes);
            renderNotes();
        }
    }

    function filterNotes(cat, btn) {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderNotes(cat);
    }

    function toggleAuth() {
        if (!isEditor) {
            const p = prompt("Editör Şifresini Girin:");
            if (p === PASS) {
                isEditor = true;
                document.getElementById('statusText').innerText = "👑 Editör Modu (Yiğit)";
                document.getElementById('authBtn').innerText = "🚪 Çıkış Yap";
                document.getElementById('editorPanel').classList.add('active');
                document.getElementById('editAboutBtn').style.display = 'inline';
                renderNotes();
            } else if (p !== null) {
                alert("Hatalı şifre!");
            }
        } else {
            isEditor = false;
            document.getElementById('statusText').innerText = "🌐 Ziyaretçi Modu";
            document.getElementById('authBtn').innerText = "🔐 Editör Girişi";
            document.getElementById('editorPanel').classList.remove('active');
            document.getElementById('editAboutBtn').style.display = 'none';
            renderNotes();
        }
    }

    window.onload = () => {
        renderAbout();
        renderNotes();
    };
</script>

</body>
</html>
